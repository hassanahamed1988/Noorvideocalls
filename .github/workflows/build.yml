name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android files
        working-directory: app
        run: |
          flutter create . --project-name noor_video_calls --org com.noor --platforms=android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/><uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/><uses-permission android:name="android.permission.USE_BIOMETRIC"/><application android:usesCleartextTraffic="true"#' $M
          sed -i 's/android:label="[^"]*"/android:label="Noor Video Calls"/' $M
          sed -i 's/minSdkVersion .*/minSdkVersion 24/;s/minSdk = .*/minSdk = 24/' android/app/build.gradle* || true
      - name: Launcher icons
        run: cp -r branding/res/. app/android/app/src/main/res/
      - name: Native screenshot-block channel
        run: |
          D=app/android/app/src/main/kotlin/com/noor/noor_video_calls
          mkdir -p $D
          cp branding/MainActivity.kt $D/MainActivity.kt
      - name: Force compileSdk for plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cp branding/force-sdk.gradle ~/.gradle/init.d/
          echo "android.suppressUnsupportedCompileSdk=36" >> app/android/gradle.properties
      - name: Sign with the permanent Noor key (so new APKs install over old ones)
        working-directory: app/android/app
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing KEYSTORE_B64 secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > noor.jks
          F=build.gradle.kts
          sed -i 's/signingConfigs.getByName("debug")/signingConfigs.getByName("noor")/' $F
          sed -i 's/^    buildTypes {/    signingConfigs {\n        create("noor") {\n            storeFile = file("noor.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n    buildTypes {/' $F
          grep -q 'getByName("noor")' $F && grep -q 'create("noor")' $F || { echo "Signing patch failed"; cat $F; exit 1; }
      - name: Build release APK (build number always increases)
        working-directory: app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          flutter pub get
          flutter build apk --release --build-number=$((100 + GITHUB_RUN_NUMBER))
      - uses: actions/upload-artifact@v4
        with:
          name: noor-video-calls-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
